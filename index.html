
<!DOCTYPE html>
<html lang="en">
<head>
  
    <title>Product-card</title>

    <!-- font-awesome cdn -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <!-- custom css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="parent">
    <div class="orangebox">
        <img  src="./assets/laptop02.png" alt="laptop">

        <div class="boderparent">
        <div class="border-p"></div>

        

         <div class="border-p"></div>
            </div>
        
    </div>
    <div class="grybox">
       
       
          <div class="iconbox">
    <h3>TechHub</h3>
    <i class="fa-solid fa-magnifying-glass"></i>
    <i class="fa-solid fa-circle-user"></i>

    <span class="cart">
        <i class="fa-solid fa-cart-shopping"></i>
        <p class="para">20</p>
    </span>


<br><br>
    <div class="parasbox">
    <h4 class="laptophead">Laptop</h4>   
    <h1>UltraBook Pro</h1> 
    <span class="blockspan">
        <h2 class="head04 head">$799</h2>
        <h4 class="head04 through">$999</h4>
    </span>
    </div>


<div class="rambox">
    <h5>RAM</h5>
    <div class="littleorangebox">&#10003;</div>
    <!-- <div class="littleorangebox ">&#10003;</div> -->
     <h6 class="head06">16GB</h6>

    <div class="littleorangebox dark"></div>
    <h6 class="head06">32GB</h6>
</div>
<br>
<div class="rambox">
    <h5>COLOR</h5>
    <div class="littleorangebox white"></div>
    <div class="littleorangebox dark"></div>
    <div class="littleorangebox blue"></div>
     
</div>

<div class="twoiconbox">
    <i class="fa-solid fa-bag-shopping bag"></i>
    <h5 class="buyblock">Buy Now</h5>

    <i class="fa-solid fa-cart-shopping bag"></i>
    <h5 class="buyblock">Buy Now</h5>
</div>




        </div>
    </div>
</div>

    
</body>
</html>
